[mypy]
python_version = 3.11
# Catch untyped/partially-typed function parameters and variables.
# Intentionally not strict — return annotations on FastAPI route handlers
# are inferred from response_model and not worth annotating manually.
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
warn_return_any = false
warn_unused_ignores = false
no_implicit_optional = true

# third-party libs without stubs
[mypy-sqlalchemy.*]
ignore_missing_imports = true

[mypy-alembic.*]
ignore_missing_imports = true

[mypy-psycopg2.*]
ignore_missing_imports = true

# pre-existing errors in these files — tracked separately
[mypy-app.services.games]
ignore_errors = true

[mypy-app.services.stats]
ignore_errors = true

[mypy-app.routers.ingest]
ignore_errors = true
